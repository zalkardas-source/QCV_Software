services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qcv-backend
    # No "ports:" -> backend is only reachable from other containers in this
    # docker network (nginx). Add `ports: ["8000:8000"]` here if you want
    # to hit FastAPI / Swagger UI directly from the host for debugging.
    expose:
      - "8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=sqlite:////app/backend/data/qcv_app.db
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      # OAuth callback now flows through nginx on the frontend port.
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:8080/api/oauth/microsoft/callback}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-["http://localhost:8080"]}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qcv-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
